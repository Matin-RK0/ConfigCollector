name: V2Ray Config Extractor

on:
  workflow_dispatch:
  schedule:
    # اجرا هر 6 ساعت
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: v2ray-config-extractor
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Xray-core
        run: |
          echo "Downloading Xray-core..."

          curl -L -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip

          echo "Unzipping Xray-core..."
          unzip -q xray.zip xray

          echo "Making Xray executable..."
          chmod +x xray

          echo "Xray version:"
          ./xray --version

      - name: Install Tesseract OCR (برای خواندن کانفیگ داخل تصاویر)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the script
        run: |
          python main.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_USERNAMES: ${{ secrets.CHANNEL_USERNAMES }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push if changed
        run: |
          if [ ! -f subscription.txt ]; then
            echo "⚠️ subscription.txt not found. No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update subscription file"

          echo "Fetching latest changes from origin/main..."
          git fetch origin main

          echo "Rebasing local commit onto origin/main..."
          git rebase origin/main

          echo "Pushing changes..."
          git push origin HEAD:main